name: Release installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching pom.xml (without v)
        required: true
        default: '1.0.0'
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            arch: x64
          - name: macos-arm64
            runner: macos-15
            arch: aarch64
          - name: macos-x64
            runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.arch }}
          cache: maven
      - name: Prepare Windows video decoder
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-video-thumbnails.ps1
      - name: Verify and build installer
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mvn -B test
          python3 scripts/package-release.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FileFlow-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish all three installers
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: FileFlow-*
          merge-multiple: true
          path: dist
      - name: Validate installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]
          test -s "dist/FileFlow-$RELEASE_VERSION-windows-x64.msi"
          test -s "dist/FileFlow-$RELEASE_VERSION-macos-arm64.dmg"
          test -s "dist/FileFlow-$RELEASE_VERSION-macos-x64.dmg"
          (cd dist && sha256sum --check *.sha256)
          gh release create "v$RELEASE_VERSION" dist/* --target "$GITHUB_SHA" --title "FileFlow $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md" --draft
          gh release edit "v$RELEASE_VERSION" --draft=false --latest

